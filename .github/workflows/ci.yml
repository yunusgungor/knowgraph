name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Setup Joern
      run: |
        knowgraph-setup-joern || true
        
        # Verify Joern installation
        if [ -d "$HOME/.knowgraph/joern/joern-cli" ]; then
          echo "✅ Joern directory found"
          
          # Make all binaries executable
          chmod +x $HOME/.knowgraph/joern/joern-cli/joern 2>/dev/null || true
          chmod +x $HOME/.knowgraph/joern/joern-cli/bin/* 2>/dev/null || true
          
          # Verify joern executable
          if [ -f "$HOME/.knowgraph/joern/joern-cli/joern" ]; then
            echo "✅ Joern executable found and made executable"
            ls -la $HOME/.knowgraph/joern/joern-cli/joern
          else
            echo "⚠️ Joern executable not found, but continuing..."
          fi
        else
          echo "⚠️ Joern directory not found, but continuing..."
        fi

    - name: Run tests
      run: |
        pytest -v --cov=knowgraph --cov-report=xml

    - name: Lint with Ruff
      run: |
        ruff check .

    - name: Type check with MyPy
      run: |
        mypy .
