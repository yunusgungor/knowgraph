[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "knowgraph"
version = "0.6.2"
description = "Knowledge Graph-Powered RAG system with enterprise resilience patterns"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yunus Güngör", email = "mail@yunusgungor.com" }]
keywords = ["graph", "rag", "code-analysis", "knowledge-graph", "ml"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "numpy>=1.26.0",
  "scipy>=1.11.0",
  "networkx>=3.2.0",
  "click>=8.1.0",
  "rich>=13.7.0",
  "tqdm>=4.66.0",
  "mcp>=1.0.0",
  "openai>=1.0.0",
  "python-dotenv>=1.0.0",
  "tiktoken>=0.5.0",
  "gitingest>=0.3.1",
  "tenacity>=8.2.0",
  "psutil>=5.9.0",
  "aiofiles>=23.2.0",
]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-asyncio = "^0.23"
pytest-mock = "^3.12"
pytest-xdist = "^3.5"
pytest-cov = "^4.1"
ruff = "^0.5"
black = "^24.1"
mypy = "^1.8"
pyright = "^1.1.380"
pre-commit = "^3.6"
ipdb = "^0.13"

[tool.poetry.group.docs.dependencies]
sphinx = "^7.2"
sphinx-rtd-theme = "^2.0"

[project.scripts]
knowgraph = "knowgraph.adapters.cli.main:cli"

[project.urls]
Homepage = "https://github.com/yunusgungor/knowgraph"
Documentation = "https://github.com/yunusgungor/knowgraph/docs"
Repository = "https://github.com/yunusgungor/knowgraph"
Issues = "https://github.com/yunusgungor/knowgraph/issues"

# -------------------------
# Packaging (hatchling)
# -------------------------
[tool.hatch.build.targets.wheel]
packages = ["knowgraph"]

[tool.hatch.build.targets.sdist]
include = [
  "knowgraph/**",
  "docs/**",
  "tests/**",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "pyproject.toml",
]

# -------------------------
# Pyright (replaces pyrightconfig.json)
# -------------------------
[tool.pyright]
include = ["knowgraph", "tests"]
exclude = [
  "**/__pycache__",
  "**/.pytest_cache",
  "**/.mypy_cache",
  "**/.ruff_cache",
  "**/node_modules",
  "**/.venv",
  "**/venv",
  "build",
  "dist",
  "graph_store",
  "knowgraph.egg-info",
]
typeCheckingMode = "basic"
pythonVersion = "3.10"
pythonPlatform = "Linux"
venvPath = "."
venv = ".venv"

reportMissingTypeStubs = false
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
reportMissingTypeArgument = "warning"
reportUnnecessaryIsInstance = "none"
reportUnnecessaryComparison = "warning"
reportUnusedImport = "warning"
reportUnusedVariable = "warning"
reportAttributeAccessIssue = "warning"
reportIndexIssue = "warning"
reportCallIssue = "error"
reportArgumentType = "error"
reportReturnType = "error"
reportOperatorIssue = "error"
reportInvalidTypeForm = "error"
reportPossiblyUnboundVariable = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
  "-v",
  "--strict-markers",
  "--tb=short",
  "--cov=knowgraph",
  "--cov-report=html",
  "--cov-report=term-missing",
  "--cov-fail-under=70",
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests as integration tests",
  "unit: marks tests as unit tests",
  "benchmark: marks tests as performance benchmarks",
]
# pytest-asyncio modern default
asyncio_mode = "auto"

# -------------------------
# Coverage
# -------------------------
[tool.coverage.run]
source = ["knowgraph"]
omit = ["*/tests/*", "*/__pycache__/*", "*/site-packages/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "if typing.TYPE_CHECKING:",
]

# -------------------------
# Formatting (Black) + Linting (Ruff)
# -------------------------
[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
  | \.venv
  | venv
  | build
  | dist
  | graph_store
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
  ".git",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  "venv",
  "build",
  "dist",
  "graph_store",
]

[tool.ruff.format]
# Use Ruff for formatting too if you like; keep Black if you prefer.
# If you want Ruff as the formatter, set this and remove Black usage in tooling.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
  "E", "W", "F",     # basic correctness
  "I",               # import sorting (replaces isort)
  "UP",              # pyupgrade
  "B",               # bugbear
  "SIM",             # simplify
  "ARG",             # unused arguments
  "PT",              # pytest style
  "RUF",             # ruff rules
  "S",               # bandit-ish security checks
]
ignore = [
  "E501",    # line length handled by formatter
  "S101",    # asserts in tests
  "S108",    # temp file warnings (common)
  "B904",    # raise from (optional)
  "PT011",   # broad raises
  "ARG002",  # unused method args
  "ARG001",  # unused function args
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

# Keep McCabe if you actually want it; otherwise drop it (Ruff can do complexity checks too).
[tool.ruff.lint.mccabe]
max-complexity = 15

# -------------------------
# Mypy (keep if you still run it; otherwise drop and rely on Pyright)
# -------------------------
[tool.mypy]
python_version = "3.10"
strict = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_no_return = true
strict_equality = true
exclude = ["graph_store", ".venv", "venv", "build", "dist", "tests"]
disable_error_code = [
  "assignment",
  "attr-defined",
  "unreachable",
  "truthy-function",
  "index",
  "arg-type",
  "dict-item",
  "misc",
  "var-annotated",
]

[[tool.mypy.overrides]]
module = ["gitingest.*", "networkx.*", "opentelemetry.*", "psutil", "aiofiles", "aiofiles.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests", "tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
check_untyped_defs = false
warn_return_any = false
no_implicit_optional = false
